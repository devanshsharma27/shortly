name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure disposable stack
        run: |
          cp .env.example .env
          sed -i "s/replace-with-random-hex-value/$(openssl rand -hex 32)/; s/replace-with-a-different-random-hex-value/$(openssl rand -hex 32)/" .env
      - name: Build and start
        run: docker compose up --build -d --wait
      - name: Exercise real PostgreSQL, Redis, and Nginx
        run: EXPECT_TWO_INSTANCES=1 node scripts/smoke.mjs
      - name: Check backend failover
        run: |
          docker compose stop backend1
          for i in 1 2 3 4; do curl --fail http://localhost:8080/api/health; done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop disposable stack
        if: always()
        run: docker compose down -v
