# Default upstream balancing is round robin. No sticky sessions are needed.
upstream api_servers {
    zone api_servers 64k;
    server backend1:3000 max_fails=2 fail_timeout=10s;
    server backend2:3000 max_fails=2 fail_timeout=10s;
    keepalive 16;
}
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shortly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shortly/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = / { try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { try_files $uri =404; expires 1y; }
    # Both API requests and /<short-code> redirects reach the backend.
    location / {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, rather than trust, client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        add_header X-Upstream $upstream_addr always;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
